<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - FastReport Cloud Stream</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center min-vh-100 p-3">

  <div class="card bg-secondary-subtle border-secondary shadow-lg" style="max-width: 440px; width: 100%;">
    <div class="card-header border-secondary text-center py-4 bg-dark bg-opacity-50">
      <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-25 rounded-circle p-3 mb-2 text-primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-shield-lock" viewBox="0 0 16 16">
          <path d="M5.338 1.59a61 61 0 0 0-2.837.856.48.48 0 0 0-.328.39c-.554 4.157.726 7.19 2.253 9.188a10.7 10.7 0 0 0 2.287 2.233c.346.244.652.42.893.533q.18.085.293.118a1 1 0 0 0 .101.025 1 1 0 0 0 .1-.025q.114-.034.294-.118c.24-.113.546-.29.893-.533a10.7 10.7 0 0 0 2.287-2.233c1.527-1.997 2.807-5.031 2.253-9.188a.48.48 0 0 0-.328-.39c-.651-.213-1.75-.56-2.837-.855C9.552 1.29 8.531 1.067 8 1.067c-.53 0-1.552.223-2.662.524zM5.072.56C6.157.265 7.31 0 8 0s1.843.265 2.928.56c1.11.3 2.229.655 2.887.87a1.54 1.54 0 0 1 1.044 1.262c.596 4.477-.787 7.795-2.465 9.99a11.8 11.8 0 0 1-2.517 2.453 7 7 0 0 1-1.048.625c-.28.132-.581.24-.829.24s-.548-.108-.829-.24a7 7 0 0 1-1.048-.625 11.8 11.8 0 0 1-2.517-2.453C1.928 10.487.545 7.169 1.141 2.692A1.54 1.54 0 0 1 2.185 1.43 63 63 0 0 1 5.072.56"/>
          <path d="M9.5 6.5a1.5 1.5 0 0 1-1 1.415l.385 1.99a.5.5 0 0 1-.491.595h-.788a.5.5 0 0 1-.49-.595l.384-1.99A1.5 1.5 0 1 1 9.5 6.5"/>
        </svg>
      </div>
      <h4 class="fw-bold mb-0">FastReport Cloud Stream</h4>
      <div class="small text-secondary">Acceso a la plataforma de diseño y streaming</div>
    </div>

    <div class="card-body p-4">
      <ul class="nav nav-pills nav-fill mb-3" id="authTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#tab-login" type="button" role="tab">Iniciar Sesión</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="register-tab" data-bs-toggle="pill" data-bs-target="#tab-register" type="button" role="tab">Registrarse</button>
        </li>
      </ul>

      <div class="alert alert-danger d-none py-2 px-3 small" id="auth-error-alert" role="alert"></div>

      <div class="tab-content" id="authTabsContent">
        <!-- LOGIN TAB -->
        <div class="tab-pane fade show active" id="tab-login" role="tabpanel">
          <form id="form-login">
            <div class="mb-3">
              <label for="login-username" class="form-label small fw-semibold">Usuario:</label>
              <input type="text" class="form-control" id="login-username" placeholder="admin o tu usuario" required autocomplete="username">
            </div>
            <div class="mb-3">
              <label for="login-password" class="form-label small fw-semibold">Contraseña:</label>
              <input type="password" class="form-control" id="login-password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="btn-submit-login">
              Entrar al Sistema
            </button>
          </form>

          <div class="mt-3 p-2 bg-dark bg-opacity-50 rounded border border-secondary border-opacity-25 small text-secondary">
            <div><strong>Administrador sembrado:</strong></div>
            <div>Usuario: <code class="text-info">admin</code> | Contraseña: <code class="text-info">AdminPassword123!</code></div>
          </div>
        </div>

        <!-- REGISTER TAB -->
        <div class="tab-pane fade" id="tab-register" role="tabpanel">
          <form id="form-register">
            <div class="mb-3">
              <label for="reg-username" class="form-label small fw-semibold">Nombre de Usuario:</label>
              <input type="text" class="form-control" id="reg-username" placeholder="ej: usuario1" required autocomplete="username">
            </div>
            <div class="mb-3">
              <label for="reg-email" class="form-label small fw-semibold">Correo Electrónico:</label>
              <input type="email" class="form-control" id="reg-email" placeholder="usuario@empresa.com" required autocomplete="email">
            </div>
            <div class="mb-3">
              <label for="reg-password" class="form-label small fw-semibold">Contraseña:</label>
              <input type="password" class="form-control" id="reg-password" placeholder="Mínimo 6 caracteres" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-success w-100 py-2 fw-semibold" id="btn-submit-register">
              Crear Cuenta
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { setSession, getAccessToken } from './auth.js';

    const errorAlert = document.getElementById('auth-error-alert');
    const formLogin = document.getElementById('form-login');
    const formRegister = document.getElementById('form-register');

    function showError(msg) {
      errorAlert.textContent = msg;
      errorAlert.classList.remove('d-none');
    }

    function clearError() {
      errorAlert.classList.add('d-none');
      errorAlert.textContent = '';
    }

    formLogin.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Credenciales inválidas');

        setSession(data.accessToken, data.refreshToken, data.user);
        window.location.href = '/';
      } catch (err) {
        showError(err.message);
      }
    });

    formRegister.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();
      const username = document.getElementById('reg-username').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error al registrar usuario');

        setSession(data.accessToken, data.refreshToken, data.user);
        window.location.href = '/';
      } catch (err) {
        showError(err.message);
      }
    });
  </script>
</body>
</html>
