worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;

    # Dynamic WebSocket upgrade mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen       80;
        server_name  testinglab.local localhost 127.0.0.1;

        # Internal Docker DNS for dynamic container resolution by name
        resolver 127.0.0.11 valid=5s;

        # 1. Backend REST / Minimal API (.NET 9)
        location /api/ {
            proxy_pass http://fastreport_backend:3000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeouts for report processing and downloads
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 2. Frontend Web App (Directly served by this Nginx instance)
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proper MIME types and cache control for ES6 modules and assets
        location ~* \.js$ {
            default_type application/javascript;
            add_header Cache-Control "no-cache";
        }

        location ~* \.(css|html|svg|png|jpg|ico)$ {
            add_header Cache-Control "no-cache";
        }

        # 2. Dynamic WebSocket Stream Proxy for active sessions
        # Request: /stream/:sessionId/ -> forwarded to internal container on stream-net
        location ~ ^/stream/(sess_[a-zA-Z0-9_]+)(/.*)?$ {
            set $target_sess $1;
            set $sub_path $2;
            if ($sub_path = "") {
                set $sub_path "/";
            }

            proxy_pass http://fastreport_$target_sess:6080$sub_path$is_args$args;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Disable timeouts for continuous streaming
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 3. Server-Sent Events (SSE) Proxy for real-time URL and orchestrator events
        location ~ ^/api/session/events/ {
            proxy_pass http://fastreport_backend:3000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 86400s;
        }
    }
}
